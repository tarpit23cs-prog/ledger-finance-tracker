name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/ledger-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/ledger-backend:latest

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://52.91.51.121:5000/api \
            -t ${{ steps.login-ecr.outputs.registry }}/ledger-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/ledger-frontend:latest

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-036f343b3ec425ffd" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest Ledger images" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 086307193186.dkr.ecr.us-east-1.amazonaws.com",
              "sudo docker pull 086307193186.dkr.ecr.us-east-1.amazonaws.com/ledger-backend:latest",
              "sudo docker pull 086307193186.dkr.ecr.us-east-1.amazonaws.com/ledger-frontend:latest",
              "sudo docker rm -f ledger-backend || true",
              "sudo docker rm -f ledger-frontend || true",
              "sudo docker run -d --name ledger-backend --restart unless-stopped -p 5000:5000 --env-file /home/ec2-user/backend.env 086307193186.dkr.ecr.us-east-1.amazonaws.com/ledger-backend:latest",
              "sudo docker run -d --name ledger-frontend --restart unless-stopped -p 80:80 086307193186.dkr.ecr.us-east-1.amazonaws.com/ledger-frontend:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-036f343b3ec425ffd"

          echo "EC2 deployment completed successfully."